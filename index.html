<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>互动 3D 太阳系</title>
  </head>
  <body>
    <div id="app">
      <canvas id="space"></canvas>
      <div class="label-layer" aria-hidden="true"></div>
      <section class="hud" aria-live="polite">
        <p class="eyebrow">互动 3D 模型</p>
        <h1>太阳系</h1>
        <p>拖拽旋转视角，滚轮或双指缩放；点击行星或月球可查看简介，点击太阳或空白处回到总览。</p>
        <div id="planet-info" class="info-card">
          <h2>太阳系总览</h2>
          <p>当前未锁定具体行星，可自由观察整体轨道、太阳和八大行星。</p>
        </div>
        <div class="time-controls" aria-label="时间流速控制">
          <label for="time-scale">时间流速 <output id="time-scale-value" for="time-scale">0.50x</output></label>
          <input id="time-scale" class="time-slider" type="range" min="0" max="5" step="0.05" value="0.5" aria-label="时间流速，0 表示暂停" />
          <div class="view-presets" aria-label="视角预设">
            <button type="button" id="preset-overview" class="preset-btn" title="重置总览">重置总览</button>
          </div>
          <button id="tour-toggle" class="tour-button" type="button" aria-pressed="false">开启电影导览</button>
          <small id="tour-status" class="tour-status">自由探索模式</small>
        </div>
      </section>
      <div class="legend" aria-label="行星与视角选择"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
